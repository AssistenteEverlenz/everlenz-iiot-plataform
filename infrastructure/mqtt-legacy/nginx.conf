# Compatibility TLS port for HMIs whose firmware only speaks TLS 1.0/1.1 (Delta DOP-100).
# Mosquitto 2 accepts TLS 1.2+ only, so this proxy terminates the old TLS on 8884 and hands
# the plain MQTT stream to the broker's loopback listener. Authentication and topic ACLs stay
# with Mosquitto: nothing here grants access by itself. Port 8883 keeps requiring TLS 1.2+.
#
# The official nginx image builds the stream module in: no load_module line (a load_module
# for a module that is not there stops nginx at startup).

worker_processes 1;
# info: failed TLS handshakes are logged with their reason (unknown CA, protocol version...),
# which is how a legacy HMI that cannot connect gets diagnosed.
error_log /dev/stderr info;

events {
  worker_connections 1024;
}

stream {
  log_format mqtt '$remote_addr [$time_local] $ssl_protocol $status '
                  'in=$bytes_received out=$bytes_sent ${session_time}s';
  access_log /dev/stdout mqtt;

  server {
    listen 8884 ssl;
    # Installed by entrypoint.sh: the dedicated certificate when configured, else Let's Encrypt.
    ssl_certificate /run/mqtt-legacy/fullchain.pem;
    ssl_certificate_key /run/mqtt-legacy/privkey.pem;
    # SECLEVEL=0 is what lets OpenSSL 3 negotiate TLS 1.0/1.1 at all.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT:@SECLEVEL=0;
    ssl_prefer_server_ciphers on;
    ssl_handshake_timeout 15s;

    # Host network: the broker publishes its plain listener on the host loopback only.
    proxy_pass 127.0.0.1:1883;
    proxy_connect_timeout 5s;
    # Longer than any MQTT keepalive an HMI uses, so idle sessions are not cut.
    proxy_timeout 15m;
  }
}
