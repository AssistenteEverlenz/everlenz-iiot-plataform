# Internal network/localhost listener; external TLS listener below.
# Security settings stay global so the 8883 listener inherits authentication and ACL.
# Never set this to true without repeating password_file/acl_file/allow_anonymous
# inside every listener block: doing so would leave 8883 anonymous.
per_listener_settings false
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwords
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true
max_packet_size 1048576
max_queued_messages 10000
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
# No tls_version pin: Mosquitto then negotiates the highest available version and
# still refuses anything below TLS 1.2. Pinning tlsv1.2 would disable TLS 1.3.
# Only pin a version if a legacy HMI proves unable to negotiate.
