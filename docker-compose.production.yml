# Standalone Coolify definition. Never merge with the local docker-compose.yml.
x-database: &database
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify secrets}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
  DATABASE_SSL_CA_PEM: ${DATABASE_SSL_CA_PEM:-}
services:
  mosquitto:
    build: { context: ., dockerfile: infrastructure/mosquitto/Dockerfile }
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-ingestor}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD}
      MQTT_SIMULATOR_USERNAME: ${MQTT_SIMULATOR_USERNAME:-simulator}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?Set MQTT_SIMULATOR_PASSWORD}
      MQTT_DEVICE_A7_USERNAME: ${MQTT_DEVICE_A7_USERNAME:-a7-001}
      MQTT_DEVICE_A7_PASSWORD: ${MQTT_DEVICE_A7_PASSWORD:?Set MQTT_DEVICE_A7_PASSWORD}
      # Broker user the API sends equipment commands with. Empty = platform stays read-only.
      MQTT_COMMAND_PASSWORD: ${MQTT_COMMAND_PASSWORD:-}
    ports:
      # 1883 carries credentials and payloads in clear text and defaults to loopback.
      # Docker publishes ports through its own iptables DOCKER chain, which is evaluated
      # BEFORE UFW: a `ufw deny 1883` rule does NOT protect a 0.0.0.0 published port.
      # Only widen this after restricting the source at the cloud provider's firewall.
      - '${MQTT_TCP_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883'
      - '${MQTT_TLS_BIND_ADDRESS:-0.0.0.0}:${MQTT_TLS_PORT:-8883}:8883'
    volumes:
      - mqtt-config:/mosquitto/config
      - mqtt-auth:/mosquitto/auth
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
      - mqtt-provision:/mosquitto/provision
      - type: bind
        # Coolify rejects environment substitution in bind sources. This path is
        # provisioned by infrastructure/mosquitto/sync-traefik-cert.py.
        source: /data/coolify/certificates/mqtt.everlenz.com.br
        target: /mosquitto/certs
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mosquitto_sub -h 127.0.0.1 -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" -t ''$$SYS/broker/uptime'' -E -W 4',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
  # Compatibility port 8884 for HMIs limited to TLS 1.0/1.1 (see infrastructure/mqtt-legacy).
  # The broker still authenticates every client and applies the ACL; 8883 stays TLS 1.2+.
  mqtt-legacy:
    build: { context: ., dockerfile: infrastructure/mqtt-legacy/Dockerfile }
    ports:
      - '${MQTT_LEGACY_TLS_BIND_ADDRESS:-0.0.0.0}:${MQTT_LEGACY_TLS_PORT:-8884}:8884'
    volumes:
      - type: bind
        source: /data/coolify/certificates/mqtt.everlenz.com.br
        target: /certs
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      mosquitto: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8884']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  ingestor:
    build: { context: ., target: ingestor }
    init: true
    environment:
      <<: *database
      SERVICE_NAME: ingestor
      MQTT_INTERNAL_HOST: ${MQTT_INTERNAL_HOST:-mosquitto}
      MQTT_PORT: 1883
      MQTT_PROTOCOL: mqtt
      MQTT_USERNAME: ${MQTT_USERNAME:-ingestor}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-everlenz-ingestor}
      MQTT_DISCOVERY_MODE: ${MQTT_DISCOVERY_MODE:-false}
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:-iiot/+/+/+/telemetry,data/POC/group1/A7-001}
      DEVICE_OFFLINE_SECONDS: ${DEVICE_OFFLINE_SECONDS:-30}
      INGESTOR_HEALTH_PORT: 3002
    depends_on:
      mosquitto: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
  api:
    build: { context: ., target: api }
    init: true
    environment:
      <<: *database
      SERVICE_NAME: api
      API_HOST: 0.0.0.0
      API_PORT: 3001
      INGESTOR_HEALTH_URL: http://ingestor:3002/health
      DEV_TENANT_ID: ${DEV_TENANT_ID:?Set the server-side tenant UUID}
      OPERATOR_RAW_ACCESS: ${OPERATOR_RAW_ACCESS:-false}
      DEVICE_OFFLINE_SECONDS: ${DEVICE_OFFLINE_SECONDS:-30}
      MQTT_PROVISION_DIR: /mqtt-provision/requests
      # Equipment commands ("Zerar contador" on the PLC). Empty password = read-only platform.
      MQTT_INTERNAL_HOST: ${MQTT_INTERNAL_HOST:-mosquitto}
      MQTT_PORT: 1883
      MQTT_PROTOCOL: mqtt
      MQTT_COMMAND_USERNAME: commander
      MQTT_COMMAND_PASSWORD: ${MQTT_COMMAND_PASSWORD:-}
    volumes:
      - mqtt-provision:/mqtt-provision
    expose: ['3001']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
  web:
    build: { context: ., target: web }
    init: true
    environment:
      NODE_ENV: production
      SERVICE_NAME: web
      API_INTERNAL_URL: http://api:3001
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  mqtt-config:
  mqtt-auth:
  mqtt-data:
  mqtt-log:
  mqtt-provision:
